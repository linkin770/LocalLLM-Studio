appId: LocalLLM.Studio
productName: LocalLLM Studio
directories:
  output: dist
files:
  - assets/**
  - desktop/**
  - renderer/**
  - package.json
win:
  icon: assets/LocalLLM.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: LocalLLM-Studio-v${version}-lite.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
asar: true
compression: normal
